name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

env:
  TAG: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Validate release tag
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be exact versions like 2.0.0 without a leading v." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type:check

      - name: Lint check
        run: npm run lint:check

      - name: Test
        run: npm test

      - name: Bump version
        run: npm run version -- "$TAG"

      - name: Build plugin
        run: |
          npm run build

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            main.js
            manifest.json
            styles.css
            versions.json
            package.json
            package-lock.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Apply version bump
        run: |
          cp release-bundle/manifest.json manifest.json
          cp release-bundle/versions.json versions.json
          cp release-bundle/package.json package.json
          cp release-bundle/package-lock.json package-lock.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            release-bundle/main.js \
            release-bundle/manifest.json \
            release-bundle/styles.css

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: 'version bump: ${{ env.TAG }}'
          title: 'Version bump: ${{ env.TAG }}'
          body: |
            Automated version bump after release ${{ env.TAG }}

            This PR was automatically created by the release workflow.
          branch: 'version-bump/${{ env.TAG }}'
          base: 'main'
          delete-branch: true
          add-paths: |
            manifest.json
            versions.json
            package.json
            package-lock.json
